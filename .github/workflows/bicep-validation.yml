name: Bicep validation

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/bicep-validation.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/bicep-validation.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bicep-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: az bicep upgrade
      - name: Lint and compile
        run: |
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Compile parameters
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(infra/parameters/*.bicepparam)
          (( ${#files[@]} > 0 )) || exit 1
          for file in "${files[@]}"; do
            az bicep build-params --file "${file}" --stdout > /dev/null
          done

